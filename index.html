const cv=$('#sky'),cx=cv.getContext('2d'),calm=matchMedia('(prefers-reduced-motion:reduce)').matches;let W,H,stars=[],ps=[];

function sp(x,y,r){cx.beginPath();cx.moveTo(x,y-r);cx.quadraticCurveTo(x,y,x+r,y);cx.quadraticCurveTo(x,y,x,y+r);cx.quadraticCurveTo(x,y,x-r,y);cx.quadraticCurveTo(x,y,x,y-r);cx.fill()}

ps=ps.filter(p=>p.l>0);for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.vy+=.09;p.l-=.02;cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;sp(p.x,p.y,p.r*2.2)}requestAnimationFrame(loop)}

<details open><summary>Bài 1 · Liên hợp quốc</summary><div>
<h4>Bối cảnh & hình thành</h4><ul>
<li>Cuối CTTG II, phe Đồng minh chiếm ưu thế; cần tổ chức lại thế giới. Hội Quốc liên không đủ sức bảo vệ hòa bình, <b>giải thể 1946</b>.</li>
<li><b>1/1/1942</b>: 26 nước ký Tuyên bố về Liên hợp quốc.</li>
<li>Từ 1943: thỏa thuận cơ cấu (Đại hội đồng, thành viên thường trực Hội đồng Bảo an). <b>Tê-hê-ran</b> (28/11–1/12/1943): Liên Xô, Mỹ, Anh khẳng định quyết tâm.</li>
<li><b>I-an-ta</b> (2/1945): quyết định thành lập LHQ, triệu tập hội nghị thông qua Hiến chương.</li>
<li>25/4–26/6/1945, <b>Xan Phran-xi-xcô</b> (Mỹ): 50 nước thông qua Hiến chương.</li>
<li><b>24/10/1945</b>: LHQ thành lập, 51 thành viên. 31/10/1947 lấy 24/10 là Ngày LHQ. Trụ sở: Niu Oóc. Nay: <b>193</b> nước.</li></ul>
<h4>Mục tiêu (Điều 1, Hiến chương 1945)</h4><ol>
<li>Duy trì hòa bình và an ninh quốc tế (<b>quan trọng nhất</b>, là cơ sở cho các mục tiêu khác).</li>
<li>Thúc đẩy quan hệ hữu nghị giữa các dân tộc, tôn trọng bình đẳng, quyền tự quyết.</li>
<li>Hợp tác giải quyết vấn đề kinh tế, xã hội, văn hóa, nhân đạo; bảo đảm quyền con người, không phân biệt chủng tộc, giới tính, tôn giáo, ngôn ngữ.</li>
<li>Là trung tâm điều hòa các nỗ lực quốc tế.</li></ol>
<h4>Nguyên tắc (Điều 2)</h4><ul><li>Bình đẳng về chủ quyền quốc gia</li><li>Tôn trọng toàn vẹn lãnh thổ, độc lập chính trị</li><li>Từ bỏ đe dọa hoặc dùng vũ lực</li><li>Không can thiệp công việc nội bộ các nước</li><li>Tôn trọng nghĩa vụ quốc tế và luật pháp quốc tế</li><li>Giải quyết tranh chấp bằng biện pháp hòa bình</li></ul>
<h4>Vai trò</h4><ul>
<li><b>Hòa bình, an ninh:</b> ngăn chiến tranh thế giới mới từ 1945; gìn giữ hòa bình (En Xan-va-đô, Goa-tê-ma-la, Mô-dăm-bích…); giải trừ quân bị: Hiệp ước cấm phổ biến VK hạt nhân (<b>1968</b>), Công ước cấm VK hóa học (<b>1992</b>), Công ước cấm VK hạt nhân (<b>2017</b>); thúc đẩy giải phóng thuộc địa → số thành viên tăng.</li>
<li><b>Kinh tế, xã hội:</b> từ 1960 đề ra chiến lược phát triển mỗi thập kỷ; UNCTAD (thương mại và phát triển); xóa đói giảm nghèo; từ 2000 Mục tiêu Thiên niên kỷ; <b>2015</b> Chương trình nghị sự 2030 (17 mục tiêu); chống biến đổi khí hậu, dịch bệnh.</li>
<li><b>Nhân quyền, văn hóa:</b> <b>1948</b> Tuyên ngôn Nhân quyền; xây dựng các điều ước quốc tế về quyền cơ bản.</li></ul></div></details>
<details><summary>Bài 2 · Trật tự thế giới trong Chiến tranh lạnh</summary><div>
<h4>Trật tự hai cực I-an-ta</h4><ul><li>I-an-ta (2/1945): Liên Xô, Mỹ, Anh bàn kết thúc chiến tranh, sắp xếp thế giới.</li><li>Quyết định: phân chia khu vực ảnh hưởng ở châu Âu, châu Á; thành lập LHQ; Liên Xô tham chiến chống Nhật; Đức chia <b>4 vùng</b> chiếm đóng.</li><li>→ Hai cực: Mỹ (tư bản chủ nghĩa) và Liên Xô (xã hội chủ nghĩa).</li></ul>
<h4>Chiến tranh lạnh (đến 1991)</h4><ul><li>Đối đầu toàn diện về chính trị, quân sự, kinh tế, văn hóa, tư tưởng giữa hai phe, <b>không</b> dẫn đến chiến tranh nóng trực tiếp giữa hai siêu cường.</li><li>Đặc điểm: chạy đua vũ trang (hạt nhân); chiến tranh cục bộ; chiến tranh tâm lý, tuyên truyền; lập khối quân sự NATO (1949), Warsaw (1955); chia cắt Đức, Triều Tiên, Việt Nam…</li></ul>
<h4>Diễn biến chính</h4><ul><li><b>1947</b>: Học thuyết Truman, Kế hoạch Marshall</li><li><b>1949</b>: NATO; Trung Quốc ra đời; Liên Xô có bom nguyên tử</li><li><b>1950–1953</b>: Chiến tranh Triều Tiên</li><li><b>1955</b>: Warsaw</li><li><b>1962</b>: Khủng hoảng tên lửa Cuba</li><li><b>Thập niên 1970</b>: hòa dịu (détente)</li><li><b>1979–1989</b>: Chiến tranh Afghanistan; Mỹ tăng chạy đua vũ trang</li><li><b>1985–1991</b>: Cải tổ Goóc-ba-chốp; <b>1989</b> Bức tường Béc-lin sụp đổ; <b>12/1991</b> Liên Xô tan rã → hết Chiến tranh lạnh</li></ul>
<h4>Nguyên nhân sụp đổ</h4><ul><li>Sâu xa: khủng hoảng toàn diện của chế độ XHCN ở Liên Xô, Đông Âu.</li><li>Trực tiếp: cải tổ của Goóc-ba-chốp; phong trào chống đối ở Đông Âu; áp lực từ Mỹ và phương Tây.</li><li>Bước ngoặt: sự kiện 1989 và Liên Xô tan rã. Hệ quả: trật tự hai cực kết thúc.</li></ul></div></details>
<details><summary>Bài 3 · Trật tự thế giới sau Chiến tranh lạnh</summary><div>
<h4>Bối cảnh</h4><ul><li>Liên Xô tan rã (1991) → trật tự hai cực sụp đổ; Mỹ là siêu cường duy nhất một thời gian.</li><li>Các trung tâm mới nổi lên: EU, Nhật Bản, Trung Quốc, Nga, Ấn Độ…</li></ul>
<h4>Xu thế chính</h4><ul><li><b>Hòa bình, hợp tác, phát triển:</b> từ đối đầu sang đối thoại; tổ chức khu vực, quốc tế phát huy vai trò.</li><li><b>Toàn cầu hóa:</b> kinh tế, văn hóa, thông tin, KH–CN; vừa là cơ hội vừa là thách thức (bất bình đẳng, khủng hoảng lan truyền).</li><li><b>Đa cực, đa trung tâm:</b> nhiều trung tâm quyền lực cùng tồn tại, cạnh tranh ảnh hưởng.</li><li><b>Thách thức toàn cầu:</b> xung đột sắc tộc, tôn giáo, khủng bố; biến đổi khí hậu, dịch bệnh, an ninh năng lượng, lương thực; cạnh tranh chiến lược giữa các nước lớn.</li></ul>
<h4>Các lực lượng</h4><ul><li><b>Mỹ:</b> hàng đầu về kinh tế, quân sự, công nghệ, nhưng vị thế tương đối suy giảm.</li><li><b>Trung Quốc:</b> trỗi dậy, nền kinh tế lớn thứ hai thế giới.</li><li><b>Nga:</b> khôi phục vị thế, quan trọng về an ninh, năng lượng.</li><li><b>EU, Nhật Bản, Ấn Độ:</b> các trung tâm quan trọng. <b>LHQ</b> và tổ chức khu vực điều phối, giữ hòa bình, thúc đẩy hợp tác.</li></ul>
<p><b>Kết luận:</b> vừa có cơ hội hợp tác phát triển, vừa tiềm ẩn bất ổn; hòa bình, ổn định, phát triển bền vững là yêu cầu cấp thiết.</p></div></details>`}
/* ---- trò chơi ---- */
function flash(){const d=R(QA);let i=0;const go=()=>{M.innerHTML=`<div class="card"><div class="meta">Thẻ ${i+1}/${d.length} · chạm để lật</div><div class="fc" id="fc"><div class="f fr">${d[i][0]}</div><div class="f bk">${d[i][1]}</div></div><div class="row"><button class="go" id="pv">Trước</button><button class="go" id="nx">Sau</button></div></div>`;$('#fc').onclick=e=>{$('#fc').classList.toggle('flip');burst(e.clientX,e.clientY,8)};$('#pv').onclick=()=>{i=(i+d.length-1)%d.length;go()};$('#nx').onclick=()=>{i=(i+1)%d.length;go()}};go()}
function quiz(){const q=R(QA).slice(0,10);let i=0,ok=0;const go=()=>{if(i>=q.length)return end(ok,q.length,quiz);const[t,a,w]=q[i];M.innerHTML=`<div class="card"><div class="meta">Câu ${i+1}/${q.length}</div><h2>${t}</h2><div class="opts">${R([a,...w]).map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join('')}</div></div>`;choose('.opt',a,r=>{i++;ok+=r;go()})};go()}
function tf(){const q=R(QA).slice(0,12);let i=0,ok=0;const go=()=>{if(i>=q.length)return end(ok,q.length,tf);const[t,a,w]=q[i],tr=Math.random()<.5,x=tr?a:w[0|Math.random()*3];M.innerHTML=`<div class="card"><div class="meta">Câu ${i+1}/${q.length} · đáp án này đúng hay sai?</div><h2>${t}</h2><p class="ans">${x}</p><div class="row2"><button class="opt" data-v="Đúng">Đúng</button><button class="opt" data-v="Sai">Sai</button></div></div>`;choose('.opt',tr?'Đúng':'Sai',r=>{i++;ok+=r;go()})};go()}
function match(){const ps=R(PAIRS).slice(0,6),t=R(ps.flatMap((p,i)=>[[p[0],i],[p[1],i]]));let sel=null,done=0,mv=0;
M.innerHTML=`<div class="card"><div class="meta">Ghép sự kiện với năm hoặc nội dung · <span id="mv">0</span> lượt</div><div class="grid">${t.map(x=>`<button class="tile" data-i="${x[1]}">${x[0]}</button>`).join('')}</div></div>`;
M.querySelectorAll('.tile').forEach(b=>b.onclick=e=>{if(b===sel||b.classList.contains('ok'))return;if(!sel){sel=b;b.classList.add('sel');return}
const a=sel;sel=null;a.classList.remove('sel');$('#mv').textContent=++mv;
if(a.dataset.i===b.dataset.i){[a,b].forEach(x=>x.classList.add('ok'));burst(e.clientX,e.clientY,26);add(10);if(++done==6)setTimeout(()=>end(6,6,match),800)}else{[a,b].forEach(x=>x.classList.add('no'));setTimeout(()=>[a,b].forEach(x=>x.classList.remove('no')),600)}})}
function order(){const ev=R(TL).slice(0,5),an=[...ev].sort((a,b)=>a[1]-b[1]);let n=0,er=0;
M.innerHTML=`<div class="card"><div class="meta">Chạm lần lượt theo thứ tự thời gian, từ sớm đến muộn</div><div class="opts">${R(ev).map(x=>`<button class="opt" data-y="${x[1]}">${x[0]}</button>`).join('')}</div></div>`;
M.querySelectorAll('.opt').forEach(b=>b.onclick=e=>{if(b.classList.contains('ok'))return;if(+b.dataset.y===an[n][1]){b.classList.add('ok');b.insertAdjacentHTML('beforeend',`<i>${Math.floor(an[n][1])}</i>`);burst(e.clientX,e.clientY,22);add(10);if(++n==5)setTimeout(()=>end(Math.max(0,5-er),5,order),900)}else{er++;b.classList.add('no');setTimeout(()=>b.classList.remove('no'),500)}})}
function type(){const q=R(QA.filter(x=>/^[\d\/–]+$/.test(x[1]))).slice(0,8);let i=0,ok=0;const go=()=>{if(i>=q.length)return end(ok,q.length,type);M.innerHTML=`<div class="card"><div class="meta">Câu ${i+1}/${q.length} · gõ năm hoặc ngày</div><h2>${q[i][0]}</h2><input id="in" autocomplete="off" placeholder="vd: 1945"><button class="go" id="ck" style="width:100%">Kiểm tra</button><p id="fb" class="meta"></p></div>`;
const inp=$('#in');inp.focus();let lock=0;const c=()=>{if(lock)return;lock=1;const r=inp.value.replace(/\s/g,'').replace('-','–')===q[i][1],bt=$('#ck').getBoundingClientRect();$('#fb').textContent=r?'Chính xác!':'Đáp án đúng: '+q[i][1];if(r){burst(bt.x+bt.width/2,bt.y,30);add(10)}setTimeout(()=>{i++;ok+=r;go()},r?800:1600)};$('#ck').onclick=c;inp.onkeydown=e=>e.key=='Enter'&&c()};go()}
/* ---- điều hướng ---- */
const TB={home:['Trang chủ','',home],notes:['Lý thuyết','Tóm tắt đủ 3 bài để đọc nhanh',notes],flash:['Thẻ ghi nhớ','Lật thẻ hỏi – đáp',flash],quiz:['Trắc nghiệm','10 câu ngẫu nhiên, bốn đáp án',quiz],tf:['Đúng hay sai','12 nhận định, chọn nhanh',tf],match:['Ghép cặp','Nối sự kiện với năm, nội dung',match],order:['Xếp mốc thời gian','Sắp xếp 5 sự kiện theo trình tự',order],type:['Gõ năm','Tự nhớ, tự gõ đáp án',type]};
function home(){M.innerHTML=`<div class="card"><h2>Mai kiểm tra 15 phút, ôn theo thứ tự này nhé:</h2><p>Đọc <b>Lý thuyết</b> một lượt, chơi <b>Trắc nghiệm</b> và <b>Đúng hay sai</b> cho quen đề, rồi luyện <b>Xếp mốc</b> và <b>Gõ năm</b> để nhớ số liệu. Mỗi đáp án đúng được +10 ✦.</p></div><div class="modes" style="margin-top:14px">${Object.entries(TB).filter(x=>x[0]!='home').map(([k,v])=>`<button class="mode" data-k="${k}"><b>${v[0]}</b><span>${v[1]}</span></button>`).join('')}</div>`;M.querySelectorAll('.mode').forEach(b=>b.onclick=()=>show(b.dataset.k))}
function show(k){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k==k));TB[k][2]();scrollTo({top:0})}
$('#nav').innerHTML=Object.entries(TB).map(([k,v])=>`<button data-k="${k}">${v[0]}</button>`).join('');
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.k));show('home');
</script></body></html>
